<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repayment Gateway</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .payment-box {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .instruction-text {
            font-size: 14px;
            color: #333;
            margin-bottom: 10px;
        }

        .highlight-amount {
            color: #ff8c00;
            font-weight: bold;
        }

        .upi-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        /* Masked UPI Input Box */
        .upi-box {
            flex: 1;
            background-color: #f0f0f0;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            color: #333;
            text-align: center;
            user-select: none;
        }

        /* Copy Button Styling */
        .copy-btn {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .copy-btn:active {
            background-color: #0056b3;
        }

        /* Toast Notification (No Browser Popup) */
        #toast {
            visibility: hidden;
            min-width: 200px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 12px 16px;
            position: fixed;
            z-index: 9999;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="payment-box">
        <p class="instruction-text">1. Copy the UPI below and <span class="highlight-amount">transfer ₹14696.99</span></p>
        
        <div class="upi-container">
            <!-- Screen par yeh hidden/masked dikhega -->
            <div class="upi-box" id="displayUpi">don*************rtel</div>
            
            <!-- Click karne par asli UPI copy hogi -->
            <button class="copy-btn" onclick="copyRealUPI()">Copy</button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast">Copied Successfully!</div>

    <script>
        // 1. Asli UPI ID yahan rakhein
        const realUPI = "don1234567890@airtel"; 

        function copyRealUPI() {
            // Clipboard par asli UPI copy karne ka tareeqa
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(realUPI).then(() => {
                    showToast();
                }).catch(() => {
                    fallbackCopy(realUPI);
                });
            } else {
                fallbackCopy(realUPI);
            }
        }

        function fallbackCopy(text) {
            var textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand("copy");
            document.body.removeChild(textArea);
            showToast();
        }

        function showToast() {
            var toast = document.getElementById("toast");
            toast.className = "show";
            setTimeout(function() {
                toast.className = toast.className.replace("show", "");
            }, 2000);
        }
    </script>

</body>
</html>
